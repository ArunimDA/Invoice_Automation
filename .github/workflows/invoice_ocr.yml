name: Invoice Extraction & Dynamic CFO Dashboard

on:
  repository_dispatch:
    types: [drive_invoice_change]
  workflow_dispatch:

jobs:
  extract-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-genai google-api-python-client google-auth gspread requests

      - name: Run Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          INVOICES_FOLDER_ID: ${{ secrets.INVOICES_FOLDER_ID }}
          MAKE_CFO_WEBHOOK_URL: ${{ secrets.MAKE_CFO_WEBHOOK_URL }}
        run: |
          python sync_pipeline.py
